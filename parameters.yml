# Executor params
slurm:
  project: "<your-project-id>"

# Result directory base params
res:
  qc: "results/00-QC"
  trim: "results/01-trimmed"
  decon: "results/02-decontamination"

# Init params
metadata: "doc/mini_test.csv"

# Trimming parameters
trim:
  cut_right_window: 10
  cut_right_qual:   20
  len_req:          36

# BUSCO
BUSCO:
  lineage_db: "bacteria_odb10"

